<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EA662F">
<title>音声コミュニケーションアプリ</title>
<link rel="stylesheet" href="css/style.css?v=13">
</head>
<body data-theme="original">
  <div class="app" id="app">
    <button class="btn" id="brand-switch" aria-label="りょうたスイッチを再生">りょうた<br>スイッチ</button>

    <div class="theme-switcher" id="theme-switcher">
      <button type="button" class="theme-icon-btn" id="theme-original" data-theme-target="original" aria-label="オリジナルのデザインに切り替え" aria-pressed="true">
        <img src="assets/icons/sun.webp" alt="" draggable="false">
      </button>
      <button type="button" class="theme-icon-btn" id="theme-crystal" data-theme-target="crystal" aria-label="クリスタルのデザインに切り替え" aria-pressed="false" disabled>
        <svg viewBox="0 0 40 40" width="60%" height="60%" aria-hidden="true">
          <polygon points="20,3 30,10 34,20 30,30 20,37 10,30 6,20 10,10" fill="#B50022"/>
          <polygon points="20,3 30,10 20,20" fill="#FF526A"/>
          <polygon points="30,10 34,20 20,20" fill="#830018"/>
          <polygon points="20,20 34,20 30,30 20,37" fill="#5A0014"/>
          <polygon points="20,20 20,37 10,30 6,20" fill="#39000D"/>
          <circle cx="16" cy="12" r="2.2" fill="#fff" opacity="0.85"/>
        </svg>
      </button>
      <button type="button" class="theme-icon-btn" id="theme-scratch" data-theme-target="scratch" aria-label="スクラッチ風のデザインに切り替え" aria-pressed="false" disabled>
        <svg viewBox="0 0 40 40" width="60%" height="60%" aria-hidden="true">
          <path d="M12 6 L16 15 L9 14 Z" fill="#fff"/>
          <path d="M28 6 L24 15 L31 14 Z" fill="#fff"/>
          <circle cx="20" cy="21" r="12" fill="#fff"/>
          <circle cx="15" cy="20" r="1.7" fill="#7449D8"/>
          <circle cx="25" cy="20" r="1.7" fill="#7449D8"/>
        </svg>
      </button>
      <button type="button" class="theme-icon-btn" id="qr-button" aria-label="QRコードを表示" disabled>
        <svg viewBox="0 0 40 40" width="60%" height="60%" aria-hidden="true">
          <rect x="2" y="2" width="12" height="12" fill="#fff"/>
          <rect x="5" y="5" width="6" height="6" fill="#111"/>
          <rect x="26" y="2" width="12" height="12" fill="#fff"/>
          <rect x="29" y="5" width="6" height="6" fill="#111"/>
          <rect x="2" y="26" width="12" height="12" fill="#fff"/>
          <rect x="5" y="29" width="6" height="6" fill="#111"/>
          <rect x="18" y="18" width="4" height="4" fill="#fff"/>
          <rect x="24" y="18" width="4" height="4" fill="#fff"/>
          <rect x="18" y="24" width="4" height="4" fill="#fff"/>
          <rect x="30" y="24" width="4" height="4" fill="#fff"/>
          <rect x="18" y="30" width="4" height="4" fill="#fff"/>
        </svg>
      </button>
    </div>

    <div class="stage">
      <div class="caption" id="caption" aria-hidden="true"></div>

      <div class="button-grid">
        <button class="btn btn-top" id="btn-sun" data-label="おはよう" aria-label="おはようを再生">
          <img src="assets/icons/sun.webp" alt="" draggable="false">
        </button>
        <button class="btn btn-top" id="btn-hand" data-label="おつかれさま" aria-label="おつかれさまを再生">
          <img src="assets/icons/hand.webp" alt="" draggable="false">
        </button>
        <button class="btn btn-top" id="btn-finger" data-label="これみて" aria-label="これみてを再生">
          <img src="assets/icons/finger.webp" alt="" draggable="false">
        </button>

        <button class="btn btn-bottom" id="btn-1" data-effect="low" data-label="ひくいこえ" aria-label="低い声 録音または再生">
          <img src="assets/icons/1.webp" alt="" draggable="false">
        </button>
        <button class="btn btn-bottom" id="btn-2" data-effect="high" data-label="たかいこえ" aria-label="高い声 録音または再生">
          <img src="assets/icons/2.webp" alt="" draggable="false">
        </button>
        <button class="btn btn-bottom" id="btn-3" data-effect="robot" data-label="ロボットこえ" aria-label="ロボット声 録音または再生">
          <img src="assets/icons/3.webp" alt="" draggable="false">
        </button>
      </div>
    </div>
  </div>

  <script src="js/app.js?v=13"></script>
</body>
</html>
