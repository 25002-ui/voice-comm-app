<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <pattern id="perfboard" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.6" fill="#111111" fill-opacity="0.55" />
    </pattern>
  </defs>

  <!-- ユニバーサル基板(パーフボード)の穴パターン -->
  <rect x="0" y="0" width="900" height="560" fill="url(#perfboard)" />

  <!-- 銅箔パターン(配線トレース)風の線 -->
  <g stroke="#caa14b" stroke-opacity="0.55" stroke-width="2.5" fill="none">
    <path d="M 110 95 L 110 260 L 250 260 L 250 400" />
    <path d="M 200 95 L 200 180 L 620 180" />
    <path d="M 800 135 L 800 260 L 560 260" />
    <path d="M 560 260 L 560 420 L 720 420" />
    <path d="M 250 400 L 90 400 L 90 470" />
    <path d="M 480 300 L 480 220 L 380 220" />
  </g>
  <g fill="#caa14b" fill-opacity="0.7">
    <circle cx="110" cy="95" r="4" />
    <circle cx="200" cy="95" r="4" />
    <circle cx="800" cy="135" r="4" />
    <circle cx="250" cy="400" r="4" />
    <circle cx="720" cy="420" r="4" />
    <circle cx="380" cy="220" r="4" />
  </g>

  <!-- DFPlayer Mini モジュール -->
  <g transform="translate(55, 40)">
    <rect x="0" y="0" width="100" height="62" rx="4" fill="#151515" fill-opacity="0.65" stroke="#e8c877" stroke-opacity="0.6" stroke-width="1.5" />
    <g stroke="#e8c877" stroke-opacity="0.6" stroke-width="1.5">
      <line x1="-8" y1="10" x2="0" y2="10" />
      <line x1="-8" y1="22" x2="0" y2="22" />
      <line x1="-8" y1="34" x2="0" y2="34" />
      <line x1="-8" y1="46" x2="0" y2="46" />
      <line x1="100" y1="10" x2="108" y2="10" />
      <line x1="100" y1="22" x2="108" y2="22" />
      <line x1="100" y1="34" x2="108" y2="34" />
      <line x1="100" y1="46" x2="108" y2="46" />
    </g>
    <text x="50" y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#e8c877" fill-opacity="0.75">DFR0299</text>
  </g>

  <!-- microSDカード -->
  <g transform="translate(185, 40)">
    <path d="M 0 12 L 12 0 L 60 0 L 60 60 L 0 60 Z" fill="#0e0e0e" fill-opacity="0.55" stroke="#cfcfcf" stroke-opacity="0.5" stroke-width="1.5" />
    <g stroke="#cfcfcf" stroke-opacity="0.5" stroke-width="2">
      <line x1="10" y1="15" x2="10" y2="45" />
      <line x1="20" y1="10" x2="20" y2="45" />
      <line x1="30" y1="10" x2="30" y2="45" />
      <line x1="40" y1="10" x2="40" y2="45" />
    </g>
    <text x="30" y="72" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#cfcfcf" fill-opacity="0.6">microSD</text>
  </g>

  <!-- スピーカー -->
  <g transform="translate(800, 100)">
    <circle r="48" fill="#0e0e0e" fill-opacity="0.4" stroke="#dddddd" stroke-opacity="0.5" stroke-width="1.5" />
    <circle r="34" fill="none" stroke="#dddddd" stroke-opacity="0.45" stroke-width="1.2" />
    <circle r="20" fill="none" stroke="#dddddd" stroke-opacity="0.45" stroke-width="1.2" />
    <g fill="#0e0e0e" fill-opacity="0.5">
      <circle cx="-24" cy="-8" r="2.3" />
      <circle cx="-14" cy="-24" r="2.3" />
      <circle cx="2" cy="-30" r="2.3" />
      <circle cx="18" cy="-24" r="2.3" />
      <circle cx="28" cy="-8" r="2.3" />
      <circle cx="28" cy="10" r="2.3" />
      <circle cx="18" cy="26" r="2.3" />
      <circle cx="2" cy="32" r="2.3" />
      <circle cx="-14" cy="26" r="2.3" />
      <circle cx="-24" cy="10" r="2.3" />
    </g>
  </g>

  <!-- タクトスイッチ x3 -->
  <g stroke="#e0e0e0" stroke-opacity="0.55" stroke-width="1.4" fill="#101010" fill-opacity="0.45">
    <g transform="translate(150, 470)">
      <rect x="0" y="0" width="20" height="20" rx="2" />
      <line x1="4" y1="10" x2="16" y2="10" />
      <line x1="10" y1="4" x2="10" y2="16" />
    </g>
    <g transform="translate(430, 470)">
      <rect x="0" y="0" width="20" height="20" rx="2" />
      <line x1="4" y1="10" x2="16" y2="10" />
      <line x1="10" y1="4" x2="10" y2="16" />
    </g>
    <g transform="translate(700, 470)">
      <rect x="0" y="0" width="20" height="20" rx="2" />
      <line x1="4" y1="10" x2="16" y2="10" />
      <line x1="10" y1="4" x2="10" y2="16" />
    </g>
  </g>

  <!-- 抵抗(AD KEY用) -->
  <g transform="translate(390, 245)">
    <line x1="-18" y1="7" x2="0" y2="7" stroke="#cfcfcf" stroke-opacity="0.55" stroke-width="1.6" />
    <line x1="60" y1="7" x2="78" y2="7" stroke="#cfcfcf" stroke-opacity="0.55" stroke-width="1.6" />
    <rect x="0" y="0" width="60" height="14" rx="3" fill="#c9a06a" fill-opacity="0.45" stroke="#cfcfcf" stroke-opacity="0.5" stroke-width="1" />
    <rect x="12" y="0" width="4" height="14" fill="#5a3a1e" fill-opacity="0.8" />
    <rect x="24" y="0" width="4" height="14" fill="#161616" fill-opacity="0.8" />
    <rect x="36" y="0" width="4" height="14" fill="#8a1f1f" fill-opacity="0.8" />
    <rect x="50" y="0" width="4" height="14" fill="#c9a227" fill-opacity="0.8" />
  </g>

  <!-- 電源スイッチ(スライド式) -->
  <g transform="translate(600, 60)">
    <rect x="0" y="0" width="34" height="16" rx="3" fill="#0e0e0e" fill-opacity="0.5" stroke="#dddddd" stroke-opacity="0.5" stroke-width="1.3" />
    <rect x="4" y="3" width="12" height="10" rx="2" fill="#dddddd" fill-opacity="0.55" />
  </g>

  <!-- 電池ボックス(単4×3本) -->
  <g transform="translate(60, 400)">
    <rect x="0" y="0" width="150" height="52" rx="5" fill="#101010" fill-opacity="0.4" stroke="#dddddd" stroke-opacity="0.5" stroke-width="1.4" />
    <g stroke="#dddddd" stroke-opacity="0.5" stroke-width="1.2" fill="none">
      <rect x="10" y="10" width="38" height="32" rx="16" />
      <rect x="56" y="10" width="38" height="32" rx="16" />
      <rect x="102" y="10" width="38" height="32" rx="16" />
    </g>
    <g fill="#dddddd" fill-opacity="0.55" font-family="Consolas, monospace" font-size="12">
      <text x="29" y="30" text-anchor="middle">+</text>
      <text x="75" y="30" text-anchor="middle">-</text>
      <text x="121" y="30" text-anchor="middle">+</text>
    </g>
  </g>

  <!-- 配線材(リード線) -->
  <g stroke-linecap="round" fill="none">
    <path d="M 135 452 C 260 452 260 350 250 260" stroke="#8a1f1f" stroke-opacity="0.55" stroke-width="2" />
    <path d="M 148 452 C 270 470 300 380 260 260" stroke="#151515" stroke-opacity="0.55" stroke-width="2" />
    <path d="M 105 100 C 105 40 250 40 240 100" stroke="#8a1f1f" stroke-opacity="0.45" stroke-width="1.8" />
  </g>

  <!-- スペーサー・ネジ(基板固定用) 四隅 -->
  <g fill="#e0e0e0" fill-opacity="0.45" stroke="#151515" stroke-opacity="0.4" stroke-width="1">
    <g transform="translate(28, 28)">
      <circle r="7" />
      <line x1="-4" y1="0" x2="4" y2="0" stroke="#151515" stroke-opacity="0.6" stroke-width="1.4" />
    </g>
    <g transform="translate(872, 28)">
      <circle r="7" />
      <line x1="-4" y1="0" x2="4" y2="0" stroke="#151515" stroke-opacity="0.6" stroke-width="1.4" transform="rotate(35)" />
    </g>
    <g transform="translate(28, 532)">
      <circle r="7" />
      <line x1="-4" y1="0" x2="4" y2="0" stroke="#151515" stroke-opacity="0.6" stroke-width="1.4" transform="rotate(70)" />
    </g>
    <g transform="translate(872, 532)">
      <circle r="7" />
      <line x1="-4" y1="0" x2="4" y2="0" stroke="#151515" stroke-opacity="0.6" stroke-width="1.4" transform="rotate(-20)" />
    </g>
  </g>
</svg>
